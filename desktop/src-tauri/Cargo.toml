[package]
name = "code-visualizer-desktop"
version = "0.9.8"
description = "Code Visualizer: the dependency graph of several repositories, one tab each"
edition = "2021"

[lib]
name = "code_visualizer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
